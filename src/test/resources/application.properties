# ==========================================
# KONFIGURASI TESTING (PAKAI POSTGRESQL)
# ==========================================
# Karena pom.xml tidak boleh diubah (tidak ada H2),
# maka testing wajib connect ke PostgreSQL lokal Anda.

spring.datasource.url=jdbc:postgresql://localhost:5432/db_pbo_app
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Gunakan 'update' agar aman dan tidak menghapus data Anda saat tes berjalan
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Folder upload dummy untuk test agar folder asli aman
app.upload.dir=target/test-uploads

# Matikan log yang tidak perlu
logging.level.root=INFO
spring.main.banner-mode=off