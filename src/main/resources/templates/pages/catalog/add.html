<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="addFlowerModal" class="modal fade" id="addFlowerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/flowers/save}" method="post" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Tambah Koleksi Bunga</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nama Bunga</label>
            <input type="text" name="name" class="form-control" required placeholder="Misal: Anggrek Bulan">
          </div>
          <div class="mb-3">
            <label class="form-label">Varietas / Warna</label>
            <input type="text" name="variety" class="form-control" required placeholder="Misal: Putih">
          </div>
          <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Harga (Rp)</label>
                <input type="number" name="price" class="form-control" required>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Stok Awal</label>
                <input type="number" name="stock" class="form-control" value="1" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Foto Bunga</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            <div class="form-text">Format: JPG, PNG. Maks 5MB.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>
</html>
