<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="deleteFlowerModal" class="modal fade" id="deleteFlowerModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/flowers/delete}" method="post">
        <div class="modal-header">
          <h5 class="modal-title text-danger">Hapus Bunga</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" id="deleteFlowerId">
          <p>Apakah Anda yakin ingin menghapus <strong id="deleteFlowerName"></strong> dari katalog?</p>
          <p class="text-muted small">Tindakan ini tidak dapat dibatalkan.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-danger">Ya, Hapus</button>
        </div>
      </form>
    </div>
  </div>
</div>
</html>
