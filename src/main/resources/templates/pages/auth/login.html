<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
>
  <head>
    <title>Masuk - Spring Boot Todolist</title>
    <style>
      .card-custom {
          border: 2px solid #e91e63;
          border-radius: 15px;
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }
      .text-pink {
          color: #e91e63;
          font-weight: bold;
      }
      .form-control:focus {
          border-color: #e91e63;
          box-shadow: 0 0 0 0.25rem rgba(233, 30, 99, 0.25);
      }
      .btn-pink {
          background-color: #e91e63;
          border-color: #e91e63;
          color: white;
          border-radius: 50px;
          font-weight: bold;
          padding: 10px 20px;
          transition: all 0.3s;
      }
      .btn-pink:hover {
          background-color: #c2185b;
          border-color: #c2185b;
          color: white;
      }
      .link-pink {
          color: #e91e63;
          text-decoration: none;
          font-weight: 600;
      }
      .link-pink:hover {
          text-decoration: underline;
          color: #ad1457;
      }
    </style>
  </head>
  <body>
    <div layout:fragment="content" class="mt-5 d-flex justify-content-center align-items-center" style="min-height: 80vh;">
      
      <form
        th:action="@{/auth/login}"
        method="post"
        th:object="${loginForm}"
        style="width: 100%; max-width: 400px;"
      >
        <div class="card card-custom mx-auto">
          <div class="card-body p-4">
            <div>
              <div class="text-center mb-4">
                <img
                  th:src="@{/assets/images/logo.png}"
                  alt="Logo"
                  width="80" 
                  class="mb-3"
                />
                
                <h4 class="text-pink">Selamat Datang Kembali!</h4>
                <span class="text-muted small">
                  Masuk menggunakan kredensial akun Anda.
                </span>
              </div>

              <div th:if="${param.error}" class="alert alert-danger">
                  Email atau kata sandi salah.
              </div>
              
              <div th:if="${param.logout}" class="alert alert-success">
                  Anda telah logout.
              </div>

              <div
                th:if="${#fields.hasGlobalErrors()}"
                class="alert alert-danger"
              >
                <th:block
                  th:each="err : ${#fields.globalErrors()}"
                  th:text="${err}"
                ></th:block>
              </div>

              <div class="form-group mb-3">
                <label for="inputEmail" class="fw-bold small mb-1">Alamat Email</label>

                <input
                  type="email"
                  class="form-control"
                  id="inputEmail"
                  name="email"
                  placeholder="nama@email.com"
                  th:field="*{email}"
                  th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                  autocomplete="username"
                  autofocus
                />
                <div
                  th:if="${#fields.hasErrors('email')}"
                  class="invalid-feedback"
                >
                  <th:block
                    th:each="err : ${#fields.errors('email')}"
                    th:text="${err}"
                  ></th:block>
                </div>
              </div>

              <div class="form-group mb-3">
                <label for="inputPassword" class="fw-bold small mb-1">Kata Sandi</label>
                <input
                  type="password"
                  class="form-control"
                  id="inputPassword"
                  name="password"
                  placeholder="******"
                  th:field="*{password}"
                  th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                  autocomplete="current-password"
                />
                <div
                  th:if="${#fields.hasErrors('password')}"
                  class="invalid-feedback"
                >
                  <th:block
                    th:each="err : ${#fields.errors('password')}"
                    th:text="${err}"
                  ></th:block>
                </div>
              </div>

              <div class="form-group mb-4 form-check">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="optionRememberMe"
                  th:field="*{rememberMe}"
                  style="cursor: pointer;"
                />
                <label class="form-check-label small text-muted" for="optionRememberMe" style="cursor: pointer;">
                  Ingat saya
                </label>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-pink btn-block">
                  Masuk
                </button>
              </div>

              <div class="text-center mt-4">
                <p class="small text-muted">
                  Belum memiliki akun?
                  <a th:href="@{/auth/register}" class="link-pink">Daftar Sekarang</a>
                </p>
              </div>
              
            </div>
          </div>
        </div>
      </form>
    </div>
  </body>
</html>
