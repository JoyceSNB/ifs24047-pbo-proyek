<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/base}"
  lang="id"
>
  <head>
    <title>Aplikasi Katalog Bunga</title>
  </head>
  <body>
    <div layout:fragment="content" class="mt-4">
      
      <div class="card mb-4 shadow-sm">
        <div class="card-body d-flex align-items-center justify-content-between">
          <h4 class="m-0">Selamat Datang, <span th:text="${auth.name}" class="fw-bold text-primary">User</span> 👋</h4>
          <a th:href="@{/auth/logout}" class="btn btn-outline-danger btn-sm">Keluar</a>
        </div>
      </div>

      <div class="card shadow">
        <div class="card-body">
          
          <div class="d-flex mb-4 align-items-center justify-content-between">
            <h3 class="card-title text-success"><i class="bi bi-flower1"></i> Katalog Bunga</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addFlowerModal">
              <i class="bi bi-plus-lg"></i> Tambah Bunga
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle table-bordered">
              <thead class="table-light text-center">
                <tr>
                  <th style="width: 100px;">Foto</th>
                  <th>Nama Bunga</th>
                  <th>Varietas</th>
                  <th>Harga</th>
                  <th>Stok</th>
                  <th style="width: 150px;">Aksi</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${listFlowers}">
                  <td class="text-center">
                    <img th:if="${item.imagePath != null}" 
                         th:src="@{'/uploads/' + ${item.imagePath}}" 
                         class="rounded shadow-sm" 
                         style="width: 70px; height: 70px; object-fit: cover;">
                    <span th:unless="${item.imagePath != null}" class="badge bg-secondary">No Img</span>
                  </td>
                  <td class="fw-bold" th:text="${item.name}">Mawar</td>
                  <td th:text="${item.variety}">Merah</td>
                  <td class="text-end" th:text="${'Rp ' + #numbers.formatDecimal(item.price, 0, 'POINT', 0, 'COMMA')}">Rp 50.000</td>
                  <td class="text-center">
                    <span th:text="${item.stock}" 
                          th:class="${item.stock > 5 ? 'badge bg-success' : 'badge bg-warning text-dark'}">
                      10
                    </span>
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-warning me-1"
                      th:attr="onclick=|prepareEditFlower('${item.id}', '${item.name}', '${item.variety}', '${item.price}', '${item.stock}')|">
                      <i class="bi bi-pencil-square"></i>
                    </button>
                    <button class="btn btn-sm btn-danger"
                      th:attr="onclick=|prepareDeleteFlower('${item.id}', '${item.name}')|">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(listFlowers)}">
                  <td colspan="6" class="text-center text-muted py-5">
                    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                    <em>Belum ada koleksi bunga. Silakan tambah data baru.</em>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div th:replace="~{models/flowers/add :: addFlowerModal}"></div>
      <div th:replace="~{models/flowers/edit :: editFlowerModal}"></div>
      <div th:replace="~{models/flowers/delete :: deleteFlowerModal}"></div>
    </div>

    <script layout:fragment="others-js">
      function prepareEditFlower(id, name, variety, price, stock) {
        document.getElementById("editFlowerId").value = id;
        document.getElementById("editFlowerName").value = name;
        document.getElementById("editFlowerVariety").value = variety;
        document.getElementById("editFlowerPrice").value = price;
        document.getElementById("editFlowerStock").value = stock;
        new bootstrap.Modal(document.getElementById("editFlowerModal")).show();
      }

      function prepareDeleteFlower(id, name) {
        document.getElementById("deleteFlowerId").value = id;
        document.getElementById("deleteFlowerName").innerText = name;
        new bootstrap.Modal(document.getElementById("deleteFlowerModal")).show();
      }
    </script>
  </body>
</html>
