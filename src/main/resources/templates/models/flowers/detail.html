<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="detailFlowerModal">
  <div class="modal fade" id="detailFlowerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Detail Bunga</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img id="detailFlowerImage" src="" class="rounded shadow-sm border" style="max-width: 100%; height: 200px; object-fit: cover; display: none;">
            <div id="detailFlowerNoImage" class="bg-light rounded border py-5 text-muted" style="display: none;">
              <i class="bi bi-image fs-1"></i><br>Tidak ada gambar
            </div>
          </div>
          
          <table class="table table-borderless">
            <tr>
              <td class="fw-bold" style="width: 120px;">Nama</td>
              <td>: <span id="detailFlowerName"></span></td>
            </tr>
            <tr>
              <td class="fw-bold">Spesies</td>
              <td>: <span class="badge bg-info text-dark" id="detailFlowerSpecies"></span></td>
            </tr>
            <tr>
              <td class="fw-bold">Harga</td>
              <td>: <span class="text-success fw-bold" id="detailFlowerPrice"></span></td>
            </tr>
            <tr>
              <td class="fw-bold">Stok</td>
              <td>: <span id="detailFlowerStock"></span></td>
            </tr>
            <tr>
              <td class="fw-bold">Deskripsi</td>
              <td>: <span class="text-muted fst-italic" id="detailFlowerDesc"></span></td>
            </tr>
          </table>
          <div class="alert alert-light border small text-muted mb-0">
            <i class="bi bi-info-circle me-1"></i> <span id="detailFlowerMeta"></span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>
</div>
</html>
