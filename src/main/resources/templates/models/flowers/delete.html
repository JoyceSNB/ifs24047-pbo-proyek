<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="editFlowerModal">
  <div class="modal fade" id="editFlowerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Ubah Data Bunga</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <form th:action="@{/flowers/save}" method="post" enctype="multipart/form-data">
          <div class="modal-body">
            
            <input type="hidden" id="editFlowerId" name="id">

            <div class="mb-3">
              <label class="form-label">Nama Bunga</label>
              <input type="text" class="form-control" id="editFlowerName" name="flowerName" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Spesies</label>
              <input type="text" class="form-control" id="editFlowerSpecies" name="species" required>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Harga (Rp)</label>
                <input type="number" class="form-control" id="editFlowerPrice" name="price" min="0" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Stok</label>
                <input type="number" class="form-control" id="editFlowerStock" name="stock" min="0" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Ganti Foto (Opsional)</label>
              <input type="file" class="form-control" name="image" accept="image/*">
              <div class="form-text text-muted">Biarkan kosong jika tidak ingin mengubah foto.</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Deskripsi</label>
              <textarea class="form-control" id="editFlowerDesc" name="description" rows="3"></textarea>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-warning">Simpan Perubahan</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</html>
